/* =====================================================================
 *  チャンクストリーミング（リアル版: 草むらは近くだけ、1フレームの作業時間に上限）
 * ===================================================================== */
const buildQueue = [], grassQueue = [];
let GRASS_DIST = 3;
let nearRTarget = 0;
function updateChunks() {
  const pcx = Math.floor(player.pos.x / CS), pcz = Math.floor(player.pos.z / CS);
  buildQueue.length = 0;
  for (let dx = -RENDER_DIST; dx <= RENDER_DIST; dx++) for (let dz = -RENDER_DIST; dz <= RENDER_DIST; dz++) {
    const dist2 = dx * dx + dz * dz;
    if (dist2 > (RENDER_DIST + 0.5) ** 2) continue;
    const cx = pcx + dx, cz = pcz + dz;
    const c = chunks.get(ckey(cx, cz));
    if (!c || !c.built) buildQueue.push({ cx, cz, d: dist2 });
  }
  buildQueue.sort((a, b) => a.d - b.d);
  for (const c of chunks.values()) {
    if (!c.built) continue;
    const dx = c.cx - pcx, dz = c.cz - pcz, d2 = dx * dx + dz * dz;
    if (d2 > (RENDER_DIST + 2) ** 2) { disposeChunkMesh(c); continue; }   // 範囲外のメッシュを破棄（データは保持）
    if (d2 <= GRASS_DIST * GRASS_DIST + 2) {
      if (!c.grassMesh && !c.grassEmpty && !c.grassQueued) { c.grassQueued = true; grassQueue.push(c); }
    } else if (d2 > (GRASS_DIST + 1) ** 2 + 2 && c.grassMesh) disposeGrass(c);
  }
  /* 遠景を切り抜く半径: まだ作れていないチャンクの手前まで */
  const full = (RENDER_DIST - 1) * CS;
  nearRTarget = buildQueue.length ? Math.min(full, Math.max(0, (Math.sqrt(buildQueue[0].d) - 1.4) * CS)) : full;
}
function processQueue(maxCount, budgetMs) {
  const t0 = performance.now();
  let n = 0;
  while (n < maxCount && buildQueue.length > 0 && (n === 0 || performance.now() - t0 < budgetMs)) {
    const q = buildQueue.shift();
    const c = ensureData(q.cx, q.cz);
    if (!c.built) { rebuildChunk(c); n++; }
  }
  if (grassQueue.length > 0 && (n === 0 || performance.now() - t0 < budgetMs)) {
    const c = grassQueue.shift();
    c.grassQueued = false;
    if (c.built && !c.grassMesh) buildGrass(c);
  }
}

/* =====================================================================
 *  昼夜サイクル（空・光・水・雲の色をまとめて更新）
 * ===================================================================== */
let timeOfDay = 0.30; // 0=真夜中, 0.25=朝, 0.5=正午
const NIGHT = new THREE.Color(0x02040c), NIGHT_H = new THREE.Color(0x0b1428);
const skyCol = new THREE.Color(), zenCol = new THREE.Color(), sunFogCol = new THREE.Color(), sunColV = new THREE.Color();
const MOON_COL = new THREE.Color(0x8fa8ff), WHITE = new THREE.Color(0xffffff), SUN_SOFT = new THREE.Color(1.0, 0.86, 0.7);
const CL_NIGHT = new THREE.Color(0.10, 0.12, 0.18), CL_NIGHT_D = new THREE.Color(0.02, 0.03, 0.06);
const sunDirV = new THREE.Vector3(), lightDirV = new THREE.Vector3();
const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3(), tmpC = new THREE.Color(), _sc = [0, 0, 0];

function updateSky(dt) {
  timeOfDay = (timeOfDay + dt / DAY_LENGTH) % 1;
  const a = timeOfDay * Math.PI * 2 - Math.PI / 2; // 0.5で太陽が真上
  const sx = Math.cos(a), sy = Math.sin(a);
  const dayF = Math.min(1, Math.max(0, (sy + 0.12) / 0.35));
  const duskF = Math.max(0, 1 - Math.abs(sy) / 0.32) * Math.min(1, dayF + 0.25);
  const nightK = (1 - dayF) * (1 - dayF);
  const p = player.pos;
  sunDirV.set(sx, sy, 0.3).normalize();

  /* 大気モデルから「太陽と反対側の地平線」「太陽側の地平線」「天頂」の色を求める */
  skySetSun(sunDirV.y);
  const hl = Math.hypot(sunDirV.x, sunDirV.z) || 1, hx = sunDirV.x / hl, hz = sunDirV.z / hl;
  skyDisplay(-hx * 0.995, 0.1, -hz * 0.995, sunDirV, _sc);
  skyCol.setRGB(_sc[0] + NIGHT_H.r * nightK, _sc[1] + NIGHT_H.g * nightK, _sc[2] + NIGHT_H.b * nightK);
  skyDisplay((hx * 0.94 - hz * 0.34) * 0.995, 0.1, (hz * 0.94 + hx * 0.34) * 0.995, sunDirV, _sc);
  sunFogCol.setRGB(_sc[0] + NIGHT_H.r * nightK, _sc[1] + NIGHT_H.g * nightK, _sc[2] + NIGHT_H.b * nightK);
  skyDisplay(0, 1, 0, sunDirV, _sc);
  zenCol.setRGB(_sc[0] + NIGHT.r * nightK, _sc[1] + NIGHT.g * nightK, _sc[2] + NIGHT.b * nightK);
  scene.background = skyCol;
  scene.fog.color.copy(skyCol);

  /* 太陽光の色: 大気を通る距離が長い（低い太陽）ほど赤くなる */
  const am = skyAirMass(Math.max(sunDirV.y, 0.0)), bR = skyP.bR, bM = skyP.bM;
  const tr = Math.exp(-(bR.x * 8400 + bM.x * 1250) * am), tg = Math.exp(-(bR.y * 8400 + bM.y * 1250) * am), tb = Math.exp(-(bR.z * 8400 + bM.z * 1250) * am);
  sunColV.setRGB(1, Math.sqrt(tg / tr), Math.sqrt(tb / tr)).lerp(SUN_SOFT, 0.3);

  const sunUp = Math.min(1, Math.max(0, (sy + 0.04) / 0.16));
  const moonUp = Math.min(1, Math.max(0, (-sy - 0.04) / 0.16));
  const useSun = sy > -0.04;
  lightDirV.set(useSun ? sx : -sx, Math.max(Math.abs(sy), 0.16), useSun ? 0.3 : -0.3).normalize();
  const warm = Math.min(1, Math.max(0, sy / 0.45));
  if (useSun) { sunLight.color.copy(sunColV); sunLight.intensity = 2.0 * Math.pow(sunUp, 0.6) * (0.72 + 0.28 * warm); }
  else        { sunLight.color.copy(MOON_COL); sunLight.intensity = 0.5 * moonUp; }
  ambient.color.copy(zenCol).lerp(WHITE, 0.35);
  ambient.groundColor.copy(skyCol).multiplyScalar(0.35).lerp(tmpC.setRGB(0.36, 0.32, 0.27), 0.6);
  ambient.intensity = 0.26 + 0.5 * dayF;

  /* 影マップは「8m移動した / 地形が変わった / 1秒経過」のときだけ描き直す */
  const cxs = Math.round(p.x / 8) * 8, cys = Math.round(p.y / 8) * 8, czs = Math.round(p.z / 8) * 8;
  shadowAge += dt;
  if (cxs !== shadowC.x || cys !== shadowC.y || czs !== shadowC.z || shadowAge > 1 || (shadowDirty && shadowAge > 0.12)) {
    shadowC.set(cxs, cys, czs); shadowAge = 0; shadowDirty = false;
    sunLight.position.set(cxs + lightDirV.x * 140, cys + lightDirV.y * 140, czs + lightDirV.z * 140);
    sunLight.target.position.set(cxs, cys, czs);
    sunLight.shadow.needsUpdate = true;
  }

  skyDome.position.copy(camera.position);
  skyU.sunDir.value.copy(sunDirV);
  skyU.sunE.value = skyP.sunE;
  skyU.expo.value = SKY.expo;
  skyU.nightK.value = nightK;
  skyU.moonK.value = 1 - dayF * 0.85;
  skyU.cloudLit.value.copy(sunColV).lerp(WHITE, 0.45).multiplyScalar(0.3 + 0.7 * sunUp).lerp(CL_NIGHT, 1 - dayF);
  skyU.cloudDark.value.copy(zenCol).lerp(skyCol, 0.5).multiplyScalar(0.78).lerp(CL_NIGHT_D, 1 - dayF);
  skyU.uCover.value = 0.5 + 0.07 * Math.sin(performance.now() * 0.00002);

  ATM.uTime.value = performance.now() * 0.001;
  ATM.uSunDir.value.copy(lightDirV);
  ATM.uSunCol.value.copy(sunLight.color).multiplyScalar(useSun ? sunUp : moonUp * 0.25);
  ATM.uZenith.value.copy(zenCol);
  ATM.uHorizon.value.copy(skyCol);
  ATM.uDay.value = 0.06 + 0.94 * dayF;
  ATM.uSunDirF.value.copy(sunDirV).multiplyScalar(useSun ? 1 : -1);
  ATM.uFogSunCol.value.copy(useSun ? sunFogCol : skyCol);
  ATM.uFogP.value.x = 0.0022 + 0.0018 * duskF + 0.0008 * nightK;     // 朝夕はもやが濃くなる

  /* 光芒: 太陽(夜は月)の画面位置と強さ */
  camera.updateMatrixWorld();
  camera.getWorldDirection(tmpV);
  const facing = Math.max(0, tmpV.dot(useSun ? sunDirV : tmpV2.copy(sunDirV).negate()));
  tmpV2.copy(useSun ? sunDirV : tmpV2).multiplyScalar(200).add(camera.position).project(camera);
  post.comp.uniforms.sunUV.value.set(tmpV2.x * 0.5 + 0.5, tmpV2.y * 0.5 + 0.5);
  post.comp.uniforms.rayK.value = facing * facing * (useSun ? sunUp * (0.16 + duskF * 0.14) : moonUp * 0.08);
  post.comp.uniforms.time.value = performance.now() * 0.001;

  starMat.opacity = Math.max(0, 1 - dayF * 1.6) * 0.85;
  stars.position.set(camera.position.x, 0, camera.position.z);
}

/* =====================================================================
 *  メインループ
 * ===================================================================== */
spawnPlayer();
updateChunks();
processQueue(9, 1e9); // 足場を先に確保
spawnPlayer();

/* ---------- Ultra版: 実写PBRテクスチャ（Poly Haven, CC0）の読み込み ---------- */
const REAL = { ready: false, failed: false, tex: {} };
const PROC_AVG = { grass: AVG_GRASS.clone(), dirt: AVG_DIRT.clone(), rock: AVG_ROCK.clone(), sand: AVG_SAND.clone() };
function imgAvgLin(img) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 16;
  const c = cv.getContext('2d'); c.drawImage(img, 0, 0, 16, 16);
  const d = c.getImageData(0, 0, 16, 16).data; let r = 0, g = 0, b = 0;
  for (let i = 0; i < d.length; i += 4) { r += (d[i] / 255) ** 2; g += (d[i + 1] / 255) ** 2; b += (d[i + 2] / 255) ** 2; }
  return new THREE.Color(r / 256, g / 256, b / 256);
}
function applyReal() {
  const on = REAL.ready && Q.real, T = REAL.tex;
  if (on) terrainMat.defines.REAL_TEX = ''; else delete terrainMat.defines.REAL_TEX;
  terrainMat.needsUpdate = true;
  TEXU.tGrass.value = on ? T.grass_diff : texGrass; TEXU.tDirt.value = on ? T.dirt_diff : texDirt;
  TEXU.tRock.value = on ? T.rock_diff : texRock;    TEXU.tSand.value = on ? T.sand_diff : texSand;
  /* 樹皮の写真は軽いので Low でも使う（法線・粗さは高画質設定のみ） */
  const bark = REAL.ready ? T.bark_diff : null;
  trunkMat.map = bark; trunkMat.normalMap = on ? T.bark_nor : null; trunkMat.roughnessMap = on ? T.bark_arm : null;
  trunkMat.color.set(bark ? 0xffffff : 0x4a3626); trunkMat.needsUpdate = true;
  const A = on ? REAL.avg : PROC_AVG;
  AVG_GRASS.copy(A.grass); AVG_DIRT.copy(A.dirt); AVG_ROCK.copy(A.rock); AVG_SAND.copy(A.sand);
  farC.x = 1e9;   // 遠景の色も作り直す
}
(function loadRealTextures() {
  const files = ['grass_diff', 'grass_nor', 'grass_arm', 'dirt_diff', 'dirt_nor', 'rock_diff', 'rock_nor', 'rock_arm',
                 'sand_diff', 'sand_nor', 'bark_diff', 'bark_nor', 'bark_arm'];
  const loader = new THREE.TextureLoader();
  let left = files.length;
  for (const f of files) loader.load('assets/textures/' + f + '.jpg', (t) => {
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
    if (f === 'bark_diff') t.encoding = THREE.sRGBEncoding;
    REAL.tex[f] = t;
    if (--left > 0) return;
    /* 写真素材の色味を、これまでの景色の色（目標）へ寄せる。寄せ具合 k は素材ごと */
    const T = REAL.tex, avg = {};
    const fit = (key, name, uni, k) => {
      const a = imgAvgLin(T[name].image), d = a.clone().lerp(PROC_AVG[key], k);
      uni.value.set(Math.sqrt(d.r / a.r), Math.sqrt(d.g / a.g), Math.sqrt(d.b / a.b));
      avg[key] = d;
    };
    fit('grass', 'grass_diff', TEXU.uTintG, 0.5); fit('dirt', 'dirt_diff', TEXU.uTintD, 0.3);
    fit('rock', 'rock_diff', TEXU.uTintR, 0.45);  fit('sand', 'sand_diff', TEXU.uTintS, 0.75);
    TEXU.tGrassN.value = T.grass_nor; TEXU.tDirtN.value = T.dirt_nor; TEXU.tRockN.value = T.rock_nor; TEXU.tSandN.value = T.sand_nor;
    TEXU.tGrassA.value = T.grass_arm; TEXU.tRockA.value = T.rock_arm;
    REAL.avg = avg; REAL.ready = true;
    applyReal(); updateBadge();
  }, undefined, () => { REAL.failed = true; updateBadge(); });
})();

/* ---------- Ultra版: 画質プリセット（F4 で切替） ---------- */
const QUALITY = {
  ultra:  { label: 'Ultra',  real: true,  refl: 0.5,  shadow: 4096, soft: true,  maxScale: 1.0,  grass: 3, slowMs: 34 },
  high:   { label: 'High',   real: true,  refl: 0.35, shadow: 2048, soft: false, maxScale: 1.0,  grass: 3, slowMs: 26 },
  medium: { label: 'Medium', real: true,  refl: 0,    shadow: 2048, soft: false, maxScale: 0.85, grass: 2, slowMs: 21.5 },
  low:    { label: 'Low',    real: false, refl: 0,    shadow: 1024, soft: false, maxScale: 0.7,  grass: 1, slowMs: 21.5 },
};
const Q_ORDER = ['ultra', 'high', 'medium', 'low'];
let qName = 'ultra', Q = QUALITY.ultra;
const qlabelEl = document.getElementById('qlabel'), resumeEl = document.getElementById('resume');
function updateBadge() {
  qlabelEl.textContent = '画質: ' + Q.label + (REAL.failed ? '（実写素材を読み込めず、手続き生成で代替）' : (REAL.ready ? '' : '（素材を読み込み中）'));
}
function applyQuality(name) {
  qName = QUALITY[name] ? name : 'ultra'; Q = QUALITY[qName];
  try { localStorage.setItem('tv_quality', qName); } catch (e) {}
  renderer.shadowMap.type = Q.soft ? THREE.PCFSoftShadowMap : THREE.PCFShadowMap;
  if (sunLight.shadow.mapSize.x !== Q.shadow) {
    sunLight.shadow.mapSize.set(Q.shadow, Q.shadow);
    if (sunLight.shadow.map) { sunLight.shadow.map.dispose(); sunLight.shadow.map = null; }
  }
  shadowDirty = true; shadowAge = 9;
  scene.traverse((o) => { if (o.material) o.material.needsUpdate = true; });
  GRASS_DIST = Q.grass;
  post.setMaxScale(Q.maxScale);
  if (Q.maxScale >= 1) post.setScale(1);
  applyReal(); updateBadge();
}
{ let q = 'ultra'; try { q = localStorage.getItem('tv_quality') || 'ultra'; } catch (e) {} applyQuality(q); }

/* ---------- Ultra版: Original（従来のブロック版）との切替（F2）。位置・視点・時刻を引き継ぐ ---------- */
const CMP_KEY = 'tv_compare';
let compareMode = false;
try {
  const st = JSON.parse(sessionStorage.getItem(CMP_KEY) || 'null');
  if (st) {
    sessionStorage.removeItem(CMP_KEY);
    player.pos.set(st.x, st.y, st.z); player.vel.set(0, 0, 0);
    player.yaw = st.yaw; player.pitch = st.pitch; player.flying = !!st.fly; timeOfDay = st.t;
    cine.yaw = st.yaw; cine.pitch = st.pitch; cine.y = NaN;
    updateChunks(); processQueue(9, 1e9);
    compareMode = true;
    menuEl.style.display = 'none'; resumeEl.style.display = 'block';
  }
} catch (e) {}
renderer.domElement.addEventListener('click', () => { if (!locked) requestLock(); });
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement) { compareMode = false; resumeEl.style.display = 'none'; }
});
document.addEventListener('keydown', (e) => {
  if (e.code === 'F4') { e.preventDefault(); applyQuality(Q_ORDER[(Q_ORDER.indexOf(qName) + 1) % Q_ORDER.length]); }
  if (e.code === 'F2') {
    e.preventDefault();
    sessionStorage.setItem(CMP_KEY, JSON.stringify({ x: player.pos.x, y: player.pos.y, z: player.pos.z,
      yaw: player.yaw, pitch: player.pitch, t: timeOfDay, fly: player.flying }));
    location.href = 'original.html';
  }
});
updateFar();

const waterOverlay = document.getElementById('water-overlay');
let lastT = performance.now();
let lastChunkCheck = 0;
const baseFog = { near: 260, far: 690 };
let ftEma = 16.7, adaptT = 0, upBlock = 0;

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (!(dt > 0)) dt = 0.001;
  const rawDt = dt;
  if (dt > 0.05) dt = 0.05;
  fpsEma = fpsEma * 0.95 + (1 / Math.max(dt, 1e-4)) * 0.05;

  if (!locked) {   /* メニュー中はゆっくり景色を見渡す */
    if (!compareMode) { cine.yaw += dt * 0.04; player.yaw = cine.yaw; } else { cine.yaw = player.yaw; cine.pitch = player.pitch; }
    const fy = visualFootY();
    if (!(Math.abs(fy - cine.y) < 3)) cine.y = fy;
    cine.y += (fy - cine.y) * Math.min(1, dt * 6);
    camera.position.set(player.pos.x, cine.y + EYE, player.pos.z);
    camera.rotation.set(cine.pitch, cine.yaw, 0);
  }
  const underwater = locked ? updatePlayer(dt) :
    (getBlock(Math.floor(camera.position.x), Math.floor(camera.position.y), Math.floor(camera.position.z)) === B.WATER);

  /* 長押しで連続して掘る・置く */
  if (locked && (mouseHeld[0] || mouseHeld[2])) {
    mouseRepeat -= dt;
    if (mouseRepeat <= 0) {
      mouseRepeat = 0.25;
      if (mouseHeld[0]) tryBreak();
      else if (mouseHeld[2]) tryPlace();
    }
  }

  /* 視線の先の編集対象を示す */
  if (locked) {
    const hit = raycast(REACH);
    if (hit) { hlBox.visible = true; hlBox.position.set(hit.x + 0.5, hit.y + 0.5, hit.z + 0.5); }
    else hlBox.visible = false;
  } else hlBox.visible = false;

  if (now - lastChunkCheck > 400) { lastChunkCheck = now; updateChunks(); }
  const loading = buildQueue.length > 0;
  processQueue(3, 6);
  updateFar();

  updateSky(dt);
  updateParticles(dt);

  /* 水中の視界 */
  if (underwater) {
    waterOverlay.style.display = 'block';
    scene.fog.near = 0; scene.fog.far = 26;
    scene.fog.color.setRGB(0.04, 0.2, 0.3).multiplyScalar(0.25 + 0.75 * ATM.uDay.value);
    scene.background = scene.fog.color;
    post.comp.uniforms.rayK.value *= 0.3;
    ATM.uFogP.value.x = 0;
  } else {
    waterOverlay.style.display = 'none';
    scene.fog.near = baseFog.near; scene.fog.far = baseFog.far;
  }
  skyDome.visible = !underwater;
  farMesh.visible = farTrees.visible = !underwater;
  ATM.uFogCol.value.copy(scene.fog.color);
  ATM.uFogNear.value = scene.fog.near; ATM.uFogFar.value = scene.fog.far;
  ATM.uCenter.value.set(player.pos.x, player.pos.z);
  ATM.uNearR.value += (nearRTarget - ATM.uNearR.value) * Math.min(1, dt * 3);
  farWater.position.x = player.pos.x; farWater.position.z = player.pos.z;

  /* 描画が重いときは内部解像度を下げ、余裕があれば戻す */
  if (rawDt < 0.1) { ftEma = ftEma * 0.94 + rawDt * 1000 * 0.06; adaptT += rawDt; upBlock -= rawDt; }   // 一時停止明けなどの飛び値は無視
  if (adaptT > 1.5 && !loading) {
    adaptT = 0;
    const s = post.getScale();
    /* 目標は画質プリセットごと（Ultra は 30fps 維持を優先し、それを下回るときだけ解像度を下げる） */
    if (ftEma > Q.slowMs && s > 0.5) { post.setScale(s - 0.1); upBlock = 12; ftEma = Q.slowMs * 0.8; }
    else if (ftEma < Q.slowMs * 0.82 && s < Q.maxScale && upBlock <= 0) { post.setScale(s + 0.05); upBlock = 3; }
  }

  if (showDebug && now - debugTick > 200) {
    debugTick = now;
    const p = player.pos;
    const dirs = ['南 (+Z)', '西 (-X)', '北 (-Z)', '東 (+X)'];
    const fi = Math.round(((-player.yaw % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) / (Math.PI / 2)) % 4;
    debugEl.textContent =
      `Terra Vista Ultra [${Q.label}] seed=${seed}\n` +
      `FPS: ${fpsEma.toFixed(0)}  解像度: ${(post.getScale() * 100).toFixed(0)}%\n` +
      `XYZ: ${p.x.toFixed(2)} / ${p.y.toFixed(2)} / ${p.z.toFixed(2)}\n` +
      `チャンク: ${Math.floor(p.x / CS)}, ${Math.floor(p.z / CS)} (生成済 ${chunks.size})\n` +
      `向き: ${dirs[fi]}  時刻: ${(timeOfDay * 24).toFixed(1)}時\n` +
      `状態: ${player.flying ? '飛行' : (player.onGround ? '地上' : '空中')}  編集: ${editMap.size}`;
  }

  ATM.uRes.value.copy(post.getSize());
  refl.render(underwater);
  post.render(scene, camera);
}
requestAnimationFrame(frame);
selectSlot(0);
itemnameEl.style.opacity = 0;
</script>
